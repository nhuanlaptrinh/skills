interface:
  display_name: "OpenClaw Windows, macOS, Linux"
  short_description: "Cài OpenClaw, phục hồi member đổi tên/copy, sửa Telegram."
  default_prompt: "Dùng skill này để tạo, vận hành hoặc sửa OpenClaw. Bắt buộc cài OpenClaw pin đúng version bằng root/Administrator, đặt runtime trong OpenClaw root quản trị, đồng bộ toàn bộ folder skill trực tiếp vào workspace/skills, chạy kiểm tra đủ skill rồi mới start Gateway. Với member Docker, kiểm tra mount thật trước; nếu folder đã đổi tên hoặc copy từ member cũ, phân loại rename-same-member/copy-new-member và không sao chép secret, identity, credential hoặc session. Nếu Telegram group không phản hồi, kiểm tra group allowlist, binding account/group vào agent main, restart Gateway, polling connected và log inbound/session/outbound. Không được dừng ở container nền hoặc dùng --skip-skills. Với Token Codex dùng https://codex.anhlaptrinh.vn/v1, openai-completions và ba model GPT-5.6-sol/GPT-5.6-terra/GPT-5.6-luna qua TOKEN_CODEX_API_KEY."
